server:
    port: 8082
spring:
  application:
    name: job-portal
  servlet:
    multipart:
      # Increase multipart limits to allow larger profile pictures and resumes
      # Values can be overridden via environment variables if needed
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5433/jobportal}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
        default_batch_fetch_size: ${DEFAULT_BATCH_SIZE:50}
    show-sql: ${SHOW_SQL:true}
  sql:
    init:
      mode: always
  docker:
    compose:
      lifecycle-management: start-and-stop
      start:
        command: up
      stop:
        command: stop

jwt:
  secret: ${JWT_SECRET:jxgEQeXHuPq8VdbyYFNkANdudQ53YUn4}
  expiration: ${JWT_EXPIRATION:24h}

#  security:
#    user:
#      name: ebrahim
#      password: password
#      roles: USER,ADMIN

logging:
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)"

cache:
  jobs:
    ttl-minutes: 5
    max-size: 5000
  companies:
    ttl-minutes: 5
    max-size: 500
  roles:
    ttl-minutes: 1
    max-size: 100    
  
app:
  cors:
    allowed-origins: http://localhost:5173,https://dev.abcham.com,https://www.abcham.com
    allowed-methods: "*"
    allowed-headers: "*"
    allowed-credentials: true
    max-age: 3600
management:
  endpoint:
    health:
      show-details: always
    configprops:
      show-values: always
    env:
      show-values: always
  endpoints:
    web:
      base-path: /jobportal/actuator
      exposure:
        include: "*"
  server:
    port: 9090
  # to enable /actuator/info info prefix below is required
  info:
    env:
      enabled: true
  otlp:
    metrics:
      export:
        url: ${METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
        step: ${METRICS_EXPORT_STEP:10s}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACING_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_LOGGING_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/logs}
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:1.0.0}
    description: Job Portal Application