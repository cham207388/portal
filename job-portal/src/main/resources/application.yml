server:
    port: 8082
spring:
  application:
    name: job-portal
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5433/jobportal}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
  docker:
    compose:
      lifecycle-management: start-and-stop
      start:
        command: up
      stop:
        command: stop

logging:
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)"