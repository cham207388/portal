server:
    port: 8082
spring:
  application:
    name: job-portal
  servlet:
    multipart:
      # Increase multipart limits to allow larger profile pictures and resumes
      # Values can be overridden via environment variables if needed
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5433/jobportal}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
        default_batch_fetch_size: ${DEFAULT_BATCH_SIZE:50}
  sql:
    init:
      mode: always
  docker:
    compose:
      lifecycle-management: start-and-stop
      start:
        command: up
      stop:
        command: stop

jwt:
  secret: ${JWT_SECRET:jxgEQeXHuPq8VdbyYFNkANdudQ53YUn4}
  expiration: ${JWT_EXPIRATION:24h}

#  security:
